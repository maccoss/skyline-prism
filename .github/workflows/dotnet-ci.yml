# C# (.NET 10) CI - cross-platform CLI matrix + Windows tool packaging.
# Scoped to dotnet/**: a docs-only change does not need the full matrix.
name: dotnet-ci

on:
  push:
    branches: [main, develop, csharp-port]
    paths: ['dotnet/**', 'global.json', '.github/workflows/dotnet-ci.yml']
  pull_request:
    branches: [main]
    paths: ['dotnet/**', 'global.json', '.github/workflows/dotnet-ci.yml']

defaults:
  run:
    working-directory: dotnet

jobs:
  # The shared algorithm/IO/QC layer and the CLI are plain net10.0 and must build + pass
  # the full parity suite on Linux, macOS, and Windows.
  cli-crossplat:
    name: CLI + tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # ScottPlot/SkiaSharp QC rendering needs fontconfig/freetype on headless Linux.
      # DuckDB.NET.Data.Full ships its own native libduckdb.
      - name: Install SkiaSharp native deps (Linux)
        if: runner.os == 'Linux'
        run: |
          # Do not let a third-party repo we do not use fail this step. `apt-get update` refreshes
          # EVERY configured source and exits non-zero when any index fails to verify - including
          # the ones the runner image ships for Google Chrome and Microsoft, neither of which PRISM
          # needs. A persistent "Hash Sum mismatch" on dl.google.com/linux/chrome-stable took every
          # Linux job in the repo down on 2026-09-09, in a step that only wants two packages out of
          # the Ubuntu archive, and re-running did not clear it.
          #
          # So tolerate a partially failed update and let the install be the gate: apt-get ignores
          # the index it could not fetch and uses the ones it could, and if the Ubuntu archive
          # really did not refresh then apt-get install fails and so does this step. Nothing that
          # matters here is being hidden.
          sudo apt-get update \
            || echo "apt-get update reported errors; continuing - the install below is the real check"
          sudo apt-get install -y libfontconfig1 libfreetype6

      - name: Restore
        run: dotnet restore SkylinePrism.CrossPlatform.slnf

      - name: Build
        run: dotnet build SkylinePrism.CrossPlatform.slnf --no-restore --configuration Debug

      - name: Test
        run: dotnet test SkylinePrism.CrossPlatform.slnf --no-build --configuration Debug --logger "console;verbosity=normal"

  # Coverage gate for the Core + CLI layer. Runs on Linux only (coverage is platform-independent)
  # and fails the build if line OR branch coverage falls below the floor - a regression guard, not a
  # tight target. Measured 2026-08-31 on coverlet 10.0.1: 92.19% line, 79.14% branch (re-measured
  # locally the same day, same figures).
  #
  # The floor is BRANCH-limited: at 75 there are 4.1 points of headroom on branch and 17.2 on line, so
  # branch is what a regression will trip first. Ratchet it up as coverage improves, but leave real
  # slack - a floor that sits a fraction under the current number turns any honest refactor into a red
  # build, and a gate people route around is worse than a loose one.
  #
  # Note when comparing against an older number: coverlet 10 finds ~2 points MORE uncovered branches
  # than 6.0.2 did on the identical commit (81.11% -> 79.14%, line and method unchanged), so a small
  # branch drop across that upgrade is the tool getting stricter, not the tests getting worse.
  # The published CLIs carry the instrument-file reader, and this is where that is checked.
  #
  # It matters because dotnet-release.yml only runs on a TAG: a mistake there is invisible until a
  # release is already building, which is how dotnet-v26.24.0 shipped a pwiz path that could not
  # resolve. Six release jobs now depend on this working, so it is worth one job here.
  #
  # All six release RIDs from one Linux runner. Cross-publishing is what the release does anyway,
  # and it exercises what actually breaks - the optional reference resolving and the reader landing
  # in the output. It cannot prove the native bits load on a foreign OS; nothing but that OS can.
  cli-reader:
    name: CLI carries the instrument-file reader (all release targets)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dotnet
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Install SkiaSharp native deps (Linux)
        run: |
          sudo apt-get update \
            || echo "apt-get update reported errors; continuing - the install below is the real check"
          sudo apt-get install -y libfontconfig1 libfreetype6

      - name: Check out pwiz-sharp
        uses: ./.github/actions/checkout-pwiz-sharp

      - name: Publish every release target with the reader
        shell: bash
        run: |
          set -euo pipefail
          for rid in win-x64 win-arm64 linux-x64 linux-arm64 osx-x64 osx-arm64; do
            echo "--- $rid"
            dotnet publish src/SkylinePrism.Cli/SkylinePrism.Cli.csproj \
              -c Release -r "$rid" --self-contained false -p:PublishSingleFile=false \
              -p:PrismWithPwiz=true -p:PwizSharpDir="$PWIZ_SHARP_DIR" \
              -p:IAgreeToVendorLicenses=true \
              -o "dist/$rid" --nologo -v q
            for dll in SkylinePrism.Pwiz.dll Pwiz.Data.MsData.dll Pwiz.Vendor.Thermo.dll; do
              if [ ! -f "dist/$rid/$dll" ]; then
                echo "::error::$dll missing from $rid; ion accounting would be unavailable there."
                exit 1
              fi
            done
            echo "    reader present."
          done

      # The reader has to actually register at runtime, not merely be on disk - it is loaded by
      # assembly name through reflection, so a publish that lands the file but breaks the load
      # would pass every file check above and still leave the command unusable.
      - name: The reader registers at run time
        shell: bash
        run: |
          set -euo pipefail
          out=$(dist/linux-x64/prism ion-accounting -d . -r . --product-tolerance "10 ppm" 2>&1 || true)
          echo "$out"
          # Assert the POSITIVE. Checking only that the error is absent would also pass if the
          # command failed earlier for an unrelated reason and never reached the reader at all.
          if ! echo "$out" | grep -q "Instrument-file reader: registered"; then
            echo "::error::the published CLI did not register a reader despite shipping one."
            exit 1
          fi
          echo "reader registered."

  coverage:
    name: Coverage gate (Core + CLI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Install SkiaSharp native deps (Linux)
        run: |
          # Do not let a third-party repo we do not use fail this step. `apt-get update` refreshes
          # EVERY configured source and exits non-zero when any index fails to verify - including
          # the ones the runner image ships for Google Chrome and Microsoft, neither of which PRISM
          # needs. A persistent "Hash Sum mismatch" on dl.google.com/linux/chrome-stable took every
          # Linux job in the repo down on 2026-09-09, in a step that only wants two packages out of
          # the Ubuntu archive, and re-running did not clear it.
          #
          # So tolerate a partially failed update and let the install be the gate: apt-get ignores
          # the index it could not fetch and uses the ones it could, and if the Ubuntu archive
          # really did not refresh then apt-get install fails and so does this step. Nothing that
          # matters here is being hidden.
          sudo apt-get update \
            || echo "apt-get update reported errors; continuing - the install below is the real check"
          sudo apt-get install -y libfontconfig1 libfreetype6

      - name: Test with coverage threshold
        run: >
          dotnet test tests/SkylinePrism.Tests/SkylinePrism.Tests.csproj
          --configuration Debug
          /p:CollectCoverage=true
          /p:CoverletOutputFormat=cobertura
          /p:ThresholdType=line%2cbranch
          /p:Threshold=75
          /p:ThresholdStat=total

  # The Windows Skyline external tool (WPF + named-pipe RPC) builds only on Windows;
  # this leg also produces the distributable tool zip.
  windows-pack:
    name: Full solution + tool zip (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Build (Debug)
        run: dotnet build SkylinePrism.sln --configuration Debug

      - name: Test
        run: dotnet test SkylinePrism.sln --no-build --configuration Debug --logger "console;verbosity=normal"

      - name: Build (Release)
        run: dotnet build SkylinePrism.sln --configuration Release

      # Packaged WITHOUT the instrument-file reader on purpose. This job proves the zip builds,
      # extracts and launches; it is not published. Cloning pwiz-sharp here would add ~270 MB and a
      # vendor-SDK extraction to every push, for a check the release job already makes - it does the
      # real checkout and build/package.proj refuses to package without one.
      #
      # The consequence is stated rather than hidden: the CI artifact below cannot read a raw file
      # and reports acquired MS2 signal as unknown. Do not hand it to a user as a release build.
      - name: Package SkylinePrism.zip (no raw reader)
        run: dotnet msbuild build/package.proj /p:Configuration=Release /p:AllowNoPwiz=true

      # Extracts the zip and runs the exe: the only check that exercises what a user actually installs.
      # The unit tests cannot see a startup crash - MainWindow needs a real dispatcher - and a
      # "the zip is complete" file check cannot either. Added after a WPF initialization-order bug
      # shipped through a green CI run: an NRE out of InitializeComponent, so the tool never opened.
      - name: Launch-verify the packaged tool
        shell: pwsh
        run: ./build/verify-tool.ps1

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: SkylinePrism-zip-no-raw-reader
          path: dotnet/publish/SkylinePrism.zip
          if-no-files-found: error
