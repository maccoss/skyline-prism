# Dependabot configuration for automated dependency updates
version: 2
updates:
  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      github-actions:
        patterns:
          - "*"

  # NuGet. Added after a high-severity advisory (GHSA-2m69-gcr7-jv3q) sat unnoticed against a
  # TRANSITIVE dependency until a newer SDK happened to audit for it - which is the case this exists to
  # catch. It is also what will surface the patched Microsoft.Data.Sqlite that lets the direct
  # SQLitePCLRaw.lib.e_sqlite3 pin in SkylinePrism.Core be removed.
  #
  # The "pip" entry that used to sit here was dropped: the Python engine was retired and removed after
  # v26.4.4, so it was watching an ecosystem this repo no longer has.
  - package-ecosystem: "nuget"
    directory: "/dotnet"
    schedule:
      interval: "weekly"
    groups:
      dotnet-dependencies:
        patterns:
          - "*"
