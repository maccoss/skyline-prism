[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "skyline-prism"
version = "26.4.4"
description = "PRISM (Proteomics Reference-Integrated Signal Modeling) - RT-aware normalization for Skyline proteomics data"
readme = "README-python.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "MacCoss Lab", email = "maccoss@uw.edu" },
]
keywords = [
    "proteomics",
    "mass-spectrometry",
    "normalization",
    "quantification",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "numpy>=1.21",
    "pandas>=1.4",
    "pytz>=2024.1",  # Avoid SyntaxWarning in older versions
    "scipy>=1.7",
    "scikit-learn>=1.0",
    "statsmodels>=0.13",
    "pyarrow>=8.0",
    "pyyaml>=6.0",
    "duckdb>=0.9",
    "PyQt6>=6.4.0",
    "PyQt6-WebEngine>=6.4.0",
    "matplotlib>=3.5",
    "seaborn>=0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black>=23.0",
    "ruff>=0.1",
    "mypy>=1.0",
]
viz = [
    "matplotlib>=3.5",
    "seaborn>=0.12",
    "plotnine>=0.12",
]

[project.scripts]
prism = "skyline_prism.__main__:main"

[project.urls]
Homepage = "https://github.com/maccoss/skyline-prism"
Documentation = "https://github.com/maccoss/skyline-prism#readme"
Repository = "https://github.com/maccoss/skyline-prism"
Skyline = "https://skyline.ms"

[tool.hatch.build.targets.wheel]
packages = ["skyline_prism"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov=skyline_prism --cov-report=term-missing"

[tool.black]
line-length = 100
target-version = ["py39", "py310", "py311", "py312"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "D", "UP"]
ignore = [
    "D100",  # module docstring not required
    "D104",  # package docstring not required
    # Docstring style: pydocstyle ships mutually exclusive pairs and ruff warns on every run until
    # one of each is silenced. These pick the convention the codebase already uses.
    "D203",  # no blank line before a class docstring (conflicts with D211, which we keep)
    "D213",  # summary on the first line, not the second (conflicts with D212, which we keep)
]

[tool.ruff.lint.per-file-ignores]
# Tests document themselves through their names and assertions; requiring a docstring on every
# helper and fixture adds noise without adding information.
"tests/*" = ["D101", "D102", "D103", "D105", "D107"]
# Holds verbatim UniProt FASTA records. A header line cannot be wrapped and remain valid FASTA,
# and shortening it would stop it testing what real headers look like.
"tests/test_fasta.py" = ["D101", "D102", "D103", "D105", "D107", "E501"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_ignores = true
