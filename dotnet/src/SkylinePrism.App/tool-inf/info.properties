Description = PRISM (Proteomics Reference-Integrated Signal Modeling): normalization of LC-MS proteomics data exported from Skyline, with robust protein quantification via Tukey median polish and reference-anchored ComBat batch correction. Runs the PRISM pipeline on the active Skyline document (PRISM + Replicates reports) and shows interactive QC plots.\
\
Combine several Skyline documents in one run - one per batch or plate - by adding them on the Inputs tab: documents open in any running Skyline, closed .sky files (exported in the background), or reports you already exported. PRISM merges them into a single cohort so ComBat can correct between them. It also runs standalone, without Skyline, on reports you already have.\
\
Requires Skyline-daily and the .NET 8.0 Desktop Runtime.
