Description = Skyline-PRISM normalizes and batch-corrects quantitative LC-MS proteomics data from Skyline, and rolls it up to robust peptide and protein abundances. It runs on the open Skyline document and shows the results as interactive plots: QC diagnostics, dynamic range, spectrum density, ion accounting, differential abundance (volcano and enrichment), and protein-panel heatmaps.\
\
For studies acquired in batches or plates, add one Skyline document per batch on the Inputs tab. A document can be open in any running Skyline, a closed .sky file, a .sky.zip downloaded from PanoramaWeb, or a report you already exported. PRISM merges them into one cohort, corrects between batches with ComBat, and uses your reference and QC samples to show whether the correction helped.\
\
PRISM also runs standalone, without Skyline, on reports you already exported. The pipeline settings can be shown as a command for the cross-platform prism CLI, so the same analysis can run on Linux or macOS.\
\
Requires Skyline-daily, the .NET 10.0 Desktop Runtime, and Windows 10 version 2004 or later.
