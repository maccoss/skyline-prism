# Deterministic parity fixture: maxLFQ protein rollup. ComBat disabled so proteins_raw and the
# corrected outputs are exact-parity against the Python golden (isolates maxLFQ).
sample_annotations:
  reference_pattern:
    - "-Pool_"
  qc_pattern:
    - "-Carl_"

parsimony:
  fasta_path: null
  shared_peptide_handling: "all_groups"

processing:
  n_workers: 1

transition_rollup:
  method: "sum"
  min_transitions: 1

global_normalization:
  method: "median"

batch_correction:
  enabled: false

protein_rollup:
  method: "maxlfq"
  min_peptides: 2

protein_normalization:
  method: "median"

output:
  format: "parquet"
  include_residuals: false

qc_report:
  enabled: false
