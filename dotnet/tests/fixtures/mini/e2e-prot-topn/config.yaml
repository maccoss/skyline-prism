# Deterministic parity fixture: topN protein rollup (nested topn.n, median_abundance selection).
# ComBat disabled so proteins_raw + corrected outputs are exact-parity against the Python golden.
# Transition rollup is sum here so this fixture isolates the protein topN method.
sample_annotations:
  reference_pattern:
    - "-Pool_"
  qc_pattern:
    - "-Carl_"

parsimony:
  fasta_path: null
  shared_peptide_handling: "all_groups"

processing:
  n_workers: 1

transition_rollup:
  method: "sum"
  min_transitions: 1

global_normalization:
  method: "median"

batch_correction:
  enabled: false

protein_rollup:
  method: "topn"
  min_peptides: 2
  topn:
    n: 3
    selection: "median_abundance"

protein_normalization:
  method: "median"

output:
  format: "parquet"
  include_residuals: false

qc_report:
  enabled: false
