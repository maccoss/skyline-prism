# Deterministic parity fixture: median_polish transition rollup (the pipeline default).
# ComBat is disabled so every stage is exact-parity (ComBat is covered by e2e-sum + unit tests);
# this isolates the rollup methods for a 1e-9 comparison against the Python golden.
sample_annotations:
  reference_pattern:
    - "-Pool_"
  qc_pattern:
    - "-Carl_"

parsimony:
  fasta_path: null
  shared_peptide_handling: "all_groups"

processing:
  n_workers: 1

transition_rollup:
  method: "median_polish"
  min_transitions: 1

global_normalization:
  method: "median"

batch_correction:
  enabled: false

protein_rollup:
  method: "median_polish"
  min_peptides: 2

protein_normalization:
  method: "median"

output:
  format: "parquet"
  include_residuals: true

qc_report:
  enabled: false
